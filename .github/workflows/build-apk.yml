name: build-apk

# Branch pseek-apk: tests + unsigned test APK (artifact).
# Tag vX.Y.Z: signed APK + AAB -> GitHub Release (visible in andrejristic/APK).
on:
  push:
    branches: ["pseek-apk", "main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python core tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run core tests (PySide6 GUI suites are not part of the APK)
        run: |
          fail=0
          for t in tests/test_*.py; do
            grep -q PySide6 "$t" && continue
            echo "::group::$t"
            python3 "$t" || { echo "::error title=$t::failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
      - name: Check Android bridge syntax
        run: python3 -m py_compile android/app/src/main/python/mobile_api.py

  android:
    name: Test + build APK
    runs-on: ubuntu-22.04
    needs: python-tests
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fetch llama.cpp for Android arm64
        run: bash android/scripts/fetch-llama.sh

      - name: Signing key
        if: env.HAS_SIGNING == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      - name: Final release needs signing secrets
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && env.HAS_SIGNING != 'true'
        run: |
          echo "::error title=signing secrets missing::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD in Settings > Secrets and variables > Actions."
          exit 1

      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "PSEEK_VERSION=$v" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${v#v}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != *-* ]]; then echo "FINAL_RELEASE=1" >> "$GITHUB_ENV"; fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          tasks=":app:assembleDebug"
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then tasks="$tasks :app:assembleRelease :app:bundleRelease"; fi
          gradle -p android $tasks --no-daemon 2>&1 | tee gradle-build.log
          mkdir -p dist
          TEST_NAME="pseek-${VERSION_NAME}-test.apk"
          [[ "$VERSION_NAME" == *-test ]] && TEST_NAME="pseek-${VERSION_NAME}.apk"
          echo "TEST_NAME=$TEST_NAME" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$TEST_NAME"
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/pseek-${VERSION_NAME}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "dist/pseek-${VERSION_NAME}.aab"
          fi
          ls -la dist

      - name: Report failure
        if: failure()
        run: |
          for f in gradle-build.log; do
            [ -f "$f" ] || continue
            grep -nE '^e: |error:|FAILED|What went wrong|Exception|Could not' "$f" | head -n 80 > errs.txt || true
            [ -s errs.txt ] || tail -n 60 "$f" > errs.txt
            split -l 12 errs.txt chunk_
            for c in chunk_*; do
              msg=$(sed 's/%/%25/g' "$c" | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f::${msg}"
            done
            rm -f chunk_* errs.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pseek-apk
          path: dist/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            files="dist/pseek-${VERSION_NAME}.apk dist/pseek-${VERSION_NAME}.aab"
          else
            files="dist/${TEST_NAME}"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files $pre \
              --title "PSEEK ${VERSION_NAME}" \
              --notes "Android build of PSEEK ${VERSION_NAME} from branch pseek-apk. Test mode works without a backend; see ANDROID-APK-README.md."
          fi
